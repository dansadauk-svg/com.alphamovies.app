name: Build Play Store Release

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        run: |
          echo "${{ secrets.ALPHA_MOVIES_KEYSTORE_BASE64 }}" | base64 --decode > ${{ github.workspace }}/alpha-movies-release-key.jks

      - name: Build signed Play Store AAB
        env:
          RELEASE_STORE_FILE: ${{ github.workspace }}/alpha-movies-release-key.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.ALPHA_MOVIES_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ALPHA_MOVIES_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ALPHA_MOVIES_KEY_PASSWORD }}
        run: gradle bundleRelease

      - name: Build signed release APK
        env:
          RELEASE_STORE_FILE: ${{ github.workspace }}/alpha-movies-release-key.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.ALPHA_MOVIES_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ALPHA_MOVIES_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ALPHA_MOVIES_KEY_PASSWORD }}
        run: gradle assembleRelease

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: alpha-movies-playstore-aab
          path: app/build/outputs/bundle/release/*.aab

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: alpha-movies-signed-release-apk
          path: app/build/outputs/apk/release/*.apk
