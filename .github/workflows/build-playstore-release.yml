name: Build Play Store Release

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: 'false'

      - name: Install Android 36 platform and build tools
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
          sdkmanager --list_installed

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Decode release keystore
        run: |
          echo "${{ secrets.ALPHA_MOVIES_KEYSTORE_BASE64 }}" | base64 --decode > ${{ github.workspace }}/alpha-movies-release-key.jks

      - name: Build signed Play Store AAB
        env:
          RELEASE_STORE_FILE: ${{ github.workspace }}/alpha-movies-release-key.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.ALPHA_MOVIES_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ALPHA_MOVIES_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ALPHA_MOVIES_KEY_PASSWORD }}
        run: gradle bundleRelease --no-daemon

      - name: Build signed release APK
        env:
          RELEASE_STORE_FILE: ${{ github.workspace }}/alpha-movies-release-key.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.ALPHA_MOVIES_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ALPHA_MOVIES_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ALPHA_MOVIES_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: alpha-movies-playstore-aab
          path: app/build/outputs/bundle/release/*.aab

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: alpha-movies-signed-release-apk
          path: app/build/outputs/apk/release/*.apk
