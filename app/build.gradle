plugins {
    id 'com.android.application'
}

android {
    namespace 'com.alphamovies.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.alphamovies.app'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        debug {
            applicationIdSuffix ''
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
